[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnsa-surrogate"
version = "0.1.0"
description = "Vessel-aware multi-task TopAneu26 baseline inspired by the RSNA 2025 winner"
requires-python = ">=3.10"
dependencies = [
  "nibabel>=5.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "torch>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["tensorboard>=2.17"]

[tool.setuptools.packages.find]
where = ["src"]
